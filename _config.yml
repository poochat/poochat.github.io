# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ovo$^{mc^2}$
subtitle: 作者:zhoukang
description: 互联网人工智能技术开发者
keywords: 人工智能算法、TensorFlow/Pytorch、C/C++/Python
author: 云上零度  
language: zh-CN 
timezone: 

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://www.coomatrix.com/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing index.html from permalinks

# Directory  #对应主题的文件位置
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md
  - README.cn.md

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
#false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Home page setting
home_background_image:
  enable: true
  rolling: true
  url: [css/images/pose.jpg, css/images/pose2.jpg, css/images/pose3.jpg, css/images/pose4.jpg]


# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:  #首页文章显示篇数
  path: ''
  per_page: 21
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true

tag_generator:
  per_page: 10

# Category & Tag
default_category: uncategorized
category_map: 
  算法编程: 算法编程
  博客教程: 
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Use post's date for updated date unless set in front-matter
# use_date_for_updated: false
updated_option: false

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: landscape

# Deployment
## Docs: https://hexo.io/docs/deployment.html
# deploy:
#  type: git
#  repo: https://github.com/KangChou/KangChou.github.io
#  branch: master
deploy:
  type: git
  repo: https://github.com/poochat/poochat.github.io.git
  branch: master

# backup
backup:
  type: git
  message: backup my blog of https://poochat.github.io.git/
  repository:
    github: https://github.com/poochat/poochat.github.io.git,backup

#站点配置yml需要配置
search:
  path: search.xml
  field: post
  format: html
  limit: 10000

# Extensions
## Plugins: http://hexo.io/plugins/
#plugins: hexo-generate-feed

# 文章末尾添加“本文结束”标记
passage_end_tag:
  enabled: true

prism_plugin:
  mode: 'preprocess' # realtime/preprocess
  theme: 'default'
  line_number: false # default false
 
#comment ShortName，您只能选择一个显示。
duoshuo_shortname: 
disqus_shortname:

plugins:
  - hexo-generator-feed
  - hexo-generator-sitemap


#Live2D动画
live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    use: live2d-widget-model-hibiki
  display:
    position: left  
    width: 150
    height: 300
  mobile:
    show: true